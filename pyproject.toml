[project]
name = "zeitnot"
version = "0.1.0"
description = "Play chess against Gemini Flash at a chosen time control and watch it think."
requires-python = ">=3.12"
dependencies = [
    "chess>=1.11",
    "google-genai>=2.34",
    "python-dotenv>=1.0",
    "fastapi>=0.115",
    "uvicorn>=0.30",
]

[dependency-groups]
dev = [
    "pytest>=9",
    "pytest-asyncio>=1.0",
    "httpx>=0.28",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["zeitnot"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
