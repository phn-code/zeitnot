[project]
name = "zeitnot"
version = "0.1.0"
description = "Play chess against Claude Opus or Codex Sol at a chosen time control and watch it think."
requires-python = ">=3.12"
dependencies = [
    "chess>=1.11",
    "google-genai>=2.34",
    "python-dotenv>=1.0",
    "fastapi>=0.115",
    "uvicorn>=0.30",
]

[project.optional-dependencies]
# Maia-2 rates how hard each position is, which sets how long the model thinks on it. Without it, the count of
# legal moves stands in. maia2 0.11 supports Python 3.10 to 3.12 and pins torch 2.8; the CPU build keeps it small.
maia = [
    "maia2==0.11.0; python_version < '3.13'",
    "torch==2.8.*; python_version < '3.13'",
]

[dependency-groups]
dev = [
    "pytest>=9",
    "pytest-asyncio>=1.0",
    "httpx>=0.28",
    # experiments/: zstandard reads the Lichess dumps, openai ran the Decisions API probe.
    "zstandard>=0.23",
    "openai>=1.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["zeitnot"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.uv.sources]
torch = [{ index = "pytorch-cpu" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
